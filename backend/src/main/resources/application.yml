spring:
  application:
    name: aneon-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/qldapm_aneon?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

aneon:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  f10:
    qr-secret: ${F10_QR_SECRET}
    check-in-base-url: ${F10_CHECK_IN_BASE_URL:http://localhost:8080/api/v1/f10/check-ins}

