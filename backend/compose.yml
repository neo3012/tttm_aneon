services:
  mysql:
    image: mysql:8.4
    container_name: aneon-mysql
    environment:
      MYSQL_DATABASE: qldapm_aneon
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - aneon_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    container_name: aneon-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - aneon_redis_data:/data

volumes:
  aneon_mysql_data:
  aneon_redis_data:
